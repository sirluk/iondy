<svg width="720" height="356" viewBox="0 0 720 356" xmlns="http://www.w3.org/2000/svg">
  <!-- Medium slop variant (AI slop levels 2–3) of phd-triangle.png. Transparent background: the page's card style at each level supplies the surface. Render with a transparent background; see README ("Diagrams"). -->
  <style>
    @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('../../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); }
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .eyebrow { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; fill: #7c3aed; }
    .heading { font-size: 16px; font-weight: 800; letter-spacing: -.03em; }
    .heading-dark { fill: #1e1b4b; }
    .heading-grad { fill: url(#grad); }
    .sub { font-size: 12px; font-weight: 500; fill: #62667f; }
    .node-title { font-size: 12.5px; font-weight: 700; fill: #1e1b4b; }
    .node-sub { font-size: 10.5px; font-weight: 500; fill: #62667f; }
    .muted-text { fill: #9496b0; }
    .accent-text { fill: #7c3aed; }
    .pill-bg { fill: #ede9fe; }
    .card { fill: #fff; stroke: rgb(124 58 237 / .22); stroke-width: 1.25; }
    .card-dropped { fill: #fbfaff; stroke: #ddd6fe; stroke-width: 1.25; stroke-dasharray: 4 4; }
    .card-accent { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
    .edge-active { fill: none; stroke: rgb(124 58 237 / .45); stroke-width: 2; }
    .edge-soft { fill: none; stroke: #c4b5fd; stroke-width: 1.75; }
    .edge-dropped { fill: none; stroke: #ddd6fe; stroke-width: 1.5; stroke-dasharray: 5 5; }
  </style>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="card-shadow" filterUnits="userSpaceOnUse" x="-720" y="-100" width="1440" height="600">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7c3aed" flood-opacity=".14" />
    </filter>
    <marker id="grad-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1 9 5 0 9Z" fill="#ec4899" />
    </marker>
  </defs>


  <!-- Left panel: Legacy Paradigm -->
  <g transform="translate(172 0)">
    <rect class="pill-bg" x="-58" y="18" width="116" height="20" rx="10" />
    <text class="eyebrow" x="0" y="31.5" text-anchor="middle">LEGACY MODEL</text>
    <text class="heading heading-dark" x="0" y="60" text-anchor="middle">The Zero-Sum Trap</text>
    <text class="sub" x="0" y="77" text-anchor="middle">Pick at most 2</text>

    <line class="edge-active" x1="0" y1="128" x2="-82" y2="294" />
    <line class="edge-dropped" x1="0" y1="128" x2="82" y2="294" />
    <line class="edge-dropped" x1="-82" y1="294" x2="82" y2="294" />

    <g filter="url(#card-shadow)">
      <rect class="card" x="-72" y="102" width="144" height="50" rx="16" />
    </g>
    <text class="node-title" x="0" y="124" text-anchor="middle">Research Output</text>
    <text class="node-sub" x="0" y="140" text-anchor="middle">Papers &amp; deadlines</text>

    <g filter="url(#card-shadow)">
      <rect class="card" x="-148" y="268" width="132" height="50" rx="16" />
    </g>
    <text class="node-title" x="-82" y="290" text-anchor="middle">Social Capital</text>
    <text class="node-sub" x="-82" y="306" text-anchor="middle">Family &amp; friends</text>

    <rect class="card-dropped" x="16" y="268" width="132" height="50" rx="16" />
    <text class="node-title muted-text" x="82" y="290" text-anchor="middle">Physical Wellness</text>
    <text class="node-sub muted-text" x="82" y="306" text-anchor="middle">Deprioritized</text>
  </g>

  <!-- Right panel: Growth Flywheel -->
  <g transform="translate(506 0)">
    <rect class="pill-bg" x="-68" y="18" width="136" height="20" rx="10" />
    <text class="eyebrow" x="0" y="31.5" text-anchor="middle">GROWTH FLYWHEEL</text>
    <text class="heading heading-grad" x="0" y="60" text-anchor="middle">The Synergy Loop</text>
    <text class="sub accent-text" x="0" y="77" text-anchor="middle">Compound returns</text>

    <line class="edge-active" x1="0" y1="128" x2="-82" y2="294" />
    <line class="edge-soft" x1="0" y1="128" x2="82" y2="294" />
    <line class="edge-soft" x1="-82" y1="294" x2="82" y2="294" />

    <!-- Curved gradient feedback arrow -->
    <path fill="none" stroke="url(#grad)" stroke-width="2.25" d="M 102 264 Q 134 196 76 134" marker-end="url(#grad-arrow)" />
    <g filter="url(#card-shadow)">
      <rect x="76" y="178" width="110" height="40" rx="12" fill="#fff" stroke="rgb(124 58 237 / .25)" stroke-width="1.25" />
    </g>
    <text class="node-title accent-text" x="131" y="195" text-anchor="middle" style="font-size: 11px;">2x Ideation</text>
    <text class="node-sub" x="131" y="209" text-anchor="middle" style="font-size: 9.5px;">Cognitive clarity</text>

    <g filter="url(#card-shadow)">
      <rect x="-72" y="102" width="144" height="50" rx="16" fill="#fff" stroke="url(#grad)" stroke-width="1.5" />
    </g>
    <text class="node-title" x="0" y="124" text-anchor="middle">Research Output</text>
    <text class="node-sub" x="0" y="140" text-anchor="middle">Higher-leverage ideas</text>

    <g filter="url(#card-shadow)">
      <rect class="card" x="-148" y="268" width="132" height="50" rx="16" />
    </g>
    <text class="node-title" x="-82" y="290" text-anchor="middle">Social Capital</text>
    <text class="node-sub" x="-82" y="306" text-anchor="middle">Family &amp; friends</text>

    <g filter="url(#card-shadow)">
      <rect class="card-accent" x="16" y="268" width="136" height="50" rx="16" />
    </g>
    <text class="node-title accent-text" x="84" y="290" text-anchor="middle">Endurance Habit</text>
    <text class="node-sub accent-text" x="84" y="306" text-anchor="middle">30–60 min · Focus</text>
  </g>
</svg>
