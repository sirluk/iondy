<!doctype html>
<!-- Published for every path while the COMING_SOON repository variable is 'true'; see .github/workflows/deploy.yml.
     The deploy copies geist.woff2 and favicon.svg next to this file. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lukas Hauzenberger — iondy</title>
    <meta name="description" content="Machine learning research, projects, and notes on what I’m learning. The site is coming soon." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face { font-family: 'Geist'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/geist.woff2') format('woff2'); }
      :root { color-scheme: light; --text: #18181b; --muted: #63636b; --subtle: #71717a; }
      * { box-sizing: border-box; }
      html { background: #fff; }
      body { display: flex; min-height: 100svh; margin: 0; color: var(--text); font: 15px/1.6 Geist, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
      main { width: 100%; max-width: 688px; margin: auto; padding: 64px 24px; }
      .wordmark { font-weight: 600; letter-spacing: -.1px; }
      h1 { margin: 56px 0 0; font-size: 20px; font-weight: 600; line-height: 1.4; letter-spacing: -.3px; }
      p { margin: 4px 0 0; color: var(--muted); }
      .status { margin-top: 36px; color: var(--text); }
      nav { display: flex; gap: 18px; margin-top: 12px; }
      a { color: var(--text); text-decoration: underline 1px #c8c8cd; text-underline-offset: 4px; }
      a:hover { text-decoration-color: currentColor; }
      a:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark">iondy</div>
      <h1>Lukas Hauzenberger</h1>
      <p>Machine learning research, projects, and notes on what I’m learning.</p>
      <p class="status">The site is coming soon. Until then, my writing is on Medium and my code is on GitHub.</p>
      <nav aria-label="Elsewhere"><a href="https://medium.com/@lukas.hauzenberger">Medium</a><a href="https://github.com/sirluk">GitHub</a></nav>
    </main>
  </body>
</html>
